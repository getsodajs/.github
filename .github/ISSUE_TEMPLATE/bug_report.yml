name: Bug report
description: Something does not work as the documentation says.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest module, controller or test that shows the problem.
      render: ts
    validations:
      required: true
  - type: input
    id: soda
    attributes:
      label: Soda version
      placeholder: '0.4.0'
    validations:
      required: true
  - type: input
    id: bun
    attributes:
      label: Bun version
      description: The output of `bun --version`.
      placeholder: '1.4.3'
    validations:
      required: true
